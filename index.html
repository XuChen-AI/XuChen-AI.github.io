<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Xu Chen - Academic Homepage</title>
    <link rel="stylesheet" href="css/homepage.css">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
    <header id="main-header">
        <!-- Clean header -->
    </header>

    <main>        <!-- Personal profile section -->
        <section id="profile">
            <div class="profile-content">
                <div class="avatar-container">
                    <img src="assets/images/avatar.svg" alt="Profile photo" id="avatar">
                </div>
            </div>
            
            <h1 id="user-name">Your Name</h1>
            <p id="user-bio">Your academic bio and research interests.</p>
        </section>

        <!-- Research projects section -->
        <section id="projects-section">
            <h2>Research Projects</h2>
            <div id="projects-grid">
                <!-- Projects will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> Xu Chen</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
