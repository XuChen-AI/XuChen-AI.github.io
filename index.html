<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Xu Chen - Academic Homepage</title>
    <link rel="stylesheet" href="css/homepage.css">
</head>
<body>
    <!-- Simplified academic homepage structure -->
    <header id="main-header">
        <!-- Clean header without background image -->
    </header>

    <main>
        <!-- Personal profile section -->
        <section id="profile">
            <div class="avatar-container">
                <img src="assets/images/avatar.svg" alt="Profile photo" id="avatar">
            </div>
            
            <h1 id="user-name">Your Name</h1>
            <p id="user-bio">Your academic bio and research interests.</p>
        </section>

        <!-- Research projects section -->
        <section id="projects-section">
            <h2>Research Projects</h2>
            <div id="projects-grid">
                <!-- Projects will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> Dr. Xu Chen. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
